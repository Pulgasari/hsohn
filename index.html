<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom HTML DSL Runtime with JSON5 & Loops</title>
  <style>
    .grid { display: flex; gap: 1rem; }
    .card { border: 1px solid #ccc; padding: 1rem; }
    .pad { background: #eee; padding: 0.5rem; margin: 0.5rem 0; }
  </style>
</head>
<body>

  <!-- JSON5 Data Source (supports unquoted keys, trailing commas, single quotes) -->
  <script type="application/json5" id="pieces-data">
    [
      { id: 'pinch', title: 'pinchable', text: 'pinch me', read: 'scale 1.00' },
      { id: 'rotate', title: 'rotatable', text: 'rotate me', read: '0°' },
      { id: 'swipe', title: 'swipeable', text: 'swipe me', read: '—' },
    ]
  </script>

  <!-- Input Template -->
  <script type="text/custom-html" id="dsl-template">
    <h2>the pieces</h2>
    <grid>
      <!-- Loop over script tag ID -->
      <each items="#pieces-data">
        <template>
          <card #="{{item.id}}">
            <strong>{{item.title}}</strong>
            <pad #-pad>{{item.text}}</pad>
            <read #-read>{{item.read}}</read>
          </card>
        </template>
      </each>
    </grid>
  </script>

  <main id="app"></main>

  <script type="module">
    import { compile2 } from './core.js';
    compile2('#app');
  </script>
</body>
</html>
