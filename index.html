<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom HTML DSL Runtime</title>
  <style>
    .grid { display: flex; gap: 1rem; }
    .card { border: 1px solid #ccc; padding: 1rem; }
    .pad { background: #eee; padding: 0.5rem; margin: 0.5rem 0; }
  </style>
</head>
<body>

  <!-- Input source embedded as raw text template -->
  <script type="text/custom-html" id="dsl-template">
    <h2>the pieces</h2>
    <grid>
      <card #pinch>
        <strong>pinchable</strong>
        <pad #-pad>pinch me</pad>
        <read #-read>scale 1.00</read>
      </card>

      <card #rotate>
        <strong>rotatable</strong>
        <pad #-pad>rotate me</pad>
        <read #-read>0°</read>
      </card>

      <card #swipe>
        <strong>swipeable</strong>
        <pad #swipe-pad>swipe me</pad>
        <read #swipe-read>—</read>
      </card>
    </grid>
  </script>

  <!-- Output target container -->
  <main id="app"></main>

  <script type='module'>
    import { compile2 } from './core.js';
    compile2();
  </script>
</body>
</html>
